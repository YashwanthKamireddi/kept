[project]
name = "katha-workspace"
version = "0.0.1"
description = "Katha — a biographer for every family, in the family's own language."
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/core", "apps/server", "apps/voice"]

[tool.uv.sources]
katha-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
