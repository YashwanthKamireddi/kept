[project]
name = "katha-evals"
version = "0.0.1"
description = "Interviewer quality evals: synthetic elders + LLM judges."
requires-python = ">=3.12,<3.13"
dependencies = [
    "katha-core",
    "katha-voice",
    "anthropic>=0.116",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katha_evals"]
