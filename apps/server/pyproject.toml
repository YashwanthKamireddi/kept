[project]
name = "katha-server"
version = "0.0.1"
description = "Katha API and post-call pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "katha-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.116",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katha_server"]
