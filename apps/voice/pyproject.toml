[project]
name = "katha-voice"
version = "0.0.1"
description = "Katha live interviewer — LiveKit Agents voice worker."
requires-python = ">=3.12,<3.13"
dependencies = [
    "katha-core",
    "anthropic>=0.116",
    "livekit-agents>=1.0",
    "httpx>=0.27",
    "livekit-plugins-sarvam>=1.6.6",
    "livekit-plugins-silero>=1.6.6",
    "livekit-plugins-turn-detector>=1.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katha_voice"]
